<html>
<head>
<meta charset="utf-8">
<title>Certificate error</title>
<style>body{font:16px/1.5 system-ui,"Segoe UI",sans-serif;max-width:620px;margin:60px auto;padding:0 20px;color:#222}
@media (prefers-color-scheme: dark){body{background:#1b1b1b;color:#e8e8e8}}
h1{font-size:24px}.why{opacity:.75;font-size:14px;word-break:break-word}button{font-size:15px;padding:8px 16px}</style>
</head>
<body>
  <!-- Pteron: no "allow anyway" here. That button needed a secret in this page, and a page of the
       same site could read it and make Pteron trust any certificate. -->
  <h1>This site's certificate is not valid</h1>
  <p>Pteron did not open the page, because the connection to it cannot be trusted. Someone may be
  trying to read or change what you send to this site.</p>
  <p class="why">${reason}</p>
  <button id="leave" onclick="history.back()">Go back</button>
</body>
</html>
