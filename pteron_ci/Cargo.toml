# Runs the unit tests of Pteron's own modules without building Servo (see .github/workflows/pteron-tests.yml).
[package]
name = "pteron_ci"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "=0.34.3"
serde_json = "1"
dirs = "6"
url = "2"
log = "0.4"
libc = "0.2"
ring = "0.17"
adblock = { version = "0.12", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
mp3lame-encoder = "0.2.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pteron_wry)'] }

[workspace]
