# Runs the unit tests of Pteron's own modules without building Servo (see .github/workflows/pteron-tests.yml).
[package]
name = "pteron_ci"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "=0.34.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
url = "2"
log = "0.4"
libc = "0.2"
ring = "0.17"
adblock = { version = "0.12", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
mp3lame-encoder = "0.2.5"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pteron_wry)'] }

[workspace]
