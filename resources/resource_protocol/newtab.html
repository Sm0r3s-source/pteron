<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="resource:///newtab.css" />
    <style>{{THEME_STYLE}}</style>
  </head>
  <body>
    <main>
      <img class="logo" src="resource:///feather.png" alt="" />
      <div class="wordmark">Sirocco</div>
      <div class="clock" id="clock"></div>
      <div class="greeting" id="greeting">Sirocco</div>
      <form action="{{FORM_ACTION}}" autocomplete="off">
        {{HIDDEN_INPUTS}}
        <div class="box">
          <svg class="mag" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" name="{{QUERY_NAME}}" autofocus autocomplete="off" />
          <span class="ph" id="ph">Search with {{ENGINE_NAME}} or type an address</span>
        </div>
        <button type="submit" aria-label="Search">&rarr;</button>
      </form>
      <div class="shortcuts">{{SHORTCUTS}}</div>
    </main>
    <script>
      (function () {
        function pad(n) { return n < 10 ? "0" + n : "" + n; }
        function tick() {
          var d = new Date();
          var h = d.getHours();
          document.getElementById("clock").textContent = pad(h) + ":" + pad(d.getMinutes());
          var part = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
          var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
          var months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
          document.getElementById("greeting").textContent =
            part + " · " + days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate();
        }
        try { tick(); setInterval(tick, 20000); } catch (e) {}
        // The hint is its own element and the input has no placeholder: the engine paints a placeholder as selected text, in place of the caret.
        var q = document.getElementById("q"), ph = document.getElementById("ph");
        function sync() { ph.style.display = q.value ? "none" : ""; }
        q.addEventListener("input", sync); sync();
      })();
    </script>
  </body>
</html>
